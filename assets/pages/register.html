<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechLivery | Login</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/login-register.css">
</head>
<body>
    <form>
        <h1>Tech<strong>Livery</strong></h1>
        <label for="name">Nome</label>
        <input type="name" name="name" required>
        <label for="email">Email</label>
        <input type="email" required name="email">
        <label for="password">Palavra-passe</label>
        <input type="password" minlength="8" required name="password">
        <label for="re-password">Repita a palavra-passe</label>
        <input type="password" name="re-password" required>
        <button type="submit">Criar conta</button>
        <a href="login.html"><strong>Já tenho conta</strong></a>
    </form>
</body>
</html>
